name: Migrate Database

# Netlify deploys don't emit GitHub deployment events, so migrations run on
# push to main instead. Only additive migrations are safe to ship alongside
# the code that uses them; for destructive ones (drops/renames), merge the
# code change first and the migration in a later PR.
on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
  workflow_dispatch:

permissions:
  contents: read

# Never run two migrations against the same database at once.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate Database
        run: pnpm drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
