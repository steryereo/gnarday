name: Migrate Database

# Netlify deploys don't emit GitHub deployment events, so migrations run on
# push to main instead. Only additive migrations are safe to ship alongside
# the code that uses them; for destructive ones (drops/renames), merge the
# code change first and the migration in a later PR.
on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
  workflow_dispatch:

permissions:
  contents: read

# Never run two migrations against the same database at once.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate Database
        run: pnpm drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
